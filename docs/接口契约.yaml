          "type": "string"
          "enum": ["MATERIAL_CONTENT"]
        "isCurrent":
          "type": "boolean"
          "description": "资料未删除且当前version等于送审version"
        "id":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "materialId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "materialVersion":
          "type": "integer"
          "minimum": 1
        "title":
          "type": "string"
        "triggerType":
          "type": "string"
          "enum":
            - "USER_SUBMITTED"
            - "RULE_HIT"
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "APPROVED"
            - "REJECTED"
        "version":
          "type": "integer"
          "minimum": 1
        "reason":
          "type": "string"
        "decisionReason":
          "type": "string"
          "nullable": true
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
      "additionalProperties": false
      "required":
        - "ownerId"
        - "type"
        - "accessScope"
        - "isCurrent"
        - "id"
        - "materialId"
        - "materialVersion"
        - "title"
        - "triggerType"
        - "status"
        - "version"
        - "reason"
        - "createdAt"
    "UserStatusInput":
      "type": "object"
      "description": "仅status及reason。原因必须非空白，长度最多1000 UTF-16，trim后审计；不能借此修改角色。"
      "properties":
        "status":
          "type": "string"
          "enum":
            - "ENABLED"
            - "DISABLED"
        "reason":
          "type": "string"
          "minLength": 1
          "maxLength": 1000
      "additionalProperties": false
      "required":
        - "status"
        - "reason"
    "AccessReason":
