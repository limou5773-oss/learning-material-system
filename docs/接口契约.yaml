          "maxLength": 1000
      "additionalProperties": false
      "required":
        - "reason"
    "ReviewContent":
      "type": "object"
      "properties":
        "reviewId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "material":
          "$ref": "#/components/schemas/Material"
        "fileAccessPath":
          "type": "string"
          "description": "仅当前审核范围的鉴权路径，不是本地或永久公共URL"
          "nullable": true
        "auditId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
      "additionalProperties": false
      "required":
        - "reviewId"
        - "material"
        - "auditId"
    "ReviewDecision":
      "type": "object"
      "properties":
        "version":
          "type": "integer"
          "minimum": 1
        "decision":
          "type": "string"
          "enum":
            - "APPROVED"
            - "REJECTED"
        "reason":
          "type": "string"
          "minLength": 1
          "maxLength": 1000
      "additionalProperties": false
      "required":
        - "version"
        - "decision"
        - "reason"
    "AdminTask":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "userId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "materialId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "goalType":
          "type": "string"
          "enum":
          - "REVIEW_CARDS"
          - "EXTRACT_KEY_POINTS"
          - "LINK_NOTES"
          - "UNKNOWN"
        "status":
          "type": "string"
          "enum":
          - "QUEUED"
          - "RUNNING"
          - "WAIT_CONFIRM"
          - "SUCCEEDED"
          - "FAILED"
          - "CANCELLED"
          - "UNKNOWN"
        "stage":
          "type": "string"
          "nullable": true
          "description": "已知内部阶段；未记录null，未识别值UNKNOWN，不透传自由字符串"
        "stepCount":
          "type": "integer"
          "minimum": 0
        "errorCode":
          "type": "string"
          "nullable": true
          "description": "已知内部错误标识；未知非空为UNRECOGNIZED_ERROR，无错误为null"
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "startedAt":
          "type": "string"
          "nullable": true
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "finishedAt":
          "type": "string"
          "nullable": true
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "durationMs":
          "type": "integer"
          "minimum": 0
          "format": "int64"
          "nullable": true
          "description": "finishedAt-startedAt毫秒；缺少起止或负跨度为null，包含人工确认等待，不估计活动任务用时"
      "additionalProperties": false
      "required":
      - "id"
      - "userId"
      - "materialId"
      - "goalType"
      - "status"
      - "stage"
      - "stepCount"
      - "errorCode"
      - "createdAt"
      - "startedAt"
      - "finishedAt"
      - "durationMs"
    "CountBucket":
      "type": "object"
      "properties":
        "key":
          "type": "string"
        "count":
          "type": "integer"
          "minimum": 0
          "format": "int64"
      "additionalProperties": false
      "required":
        - "key"
        - "count"
    "DailyCount":
      "type": "object"
      "properties":
        "date":
          "type": "string"
          "format": "date"
        "count":
          "type": "integer"
          "minimum": 0
          "format": "int64"
      "additionalProperties": false
      "required":
        - "date"
        - "count"
    "CostSummary":
      "type": "object"
      "properties":
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
        "amount":
          "type": "string"
          "pattern": "^[0-9]+(\\.[0-9]{1,6})?$"
        "knownAttempts":
          "type": "integer"
          "minimum": 0
      "additionalProperties": false
      "required":
        - "currency"
        - "amount"
        - "knownAttempts"
    "Statistics":
      "type": "object"
      "description": "当前库存与期间事件分开展示，所有数据为同一数据库快照。unknownRetryAttempts保留迁移前缺少模型步骤归属的已发送尝试，不能将其当作0重试。"
      "properties":
        "from":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "to":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "timezone":
          "type": "string"
          "enum":
            - "Asia/Shanghai"
        "activeMaterialCount":
          "description": "当前未删除资料，包括归档；不受from/to影响"
          "type": "integer"
          "minimum": 0
          "format": "int64"
        "restrictedMaterialCount":
          "description": "当前有效资料中RESTRICTED数量，不受from/to影响"
          "type": "integer"
          "minimum": 0
          "format": "int64"
        "subjects":
          "description": "当前有效资料按trim学科统计，空归未分类，按count降序/key升序，不受日期影响"
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CountBucket"
        "uploadTrend":
          "description": "范围内创建资料事件，包含后来删除者，上海自然日完整补0"
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DailyCount"
        "modelAttemptCount":
          "description": "model_attempt.started_at在范围内且dispatched=1，包含规划/生成/重试/UNKNOWN，仅表示可能发送"
          "type": "integer"
          "minimum": 0
          "format": "int64"
        "ocrAttemptCount":
          "description": "ocr_attempt.started_at在范围内且dispatched=1，缓存与未发送不计"
          "type": "integer"
          "minimum": 0
          "format": "int64"
        "retryAttemptCount":
          "description": "明确的模型step_attempt_no>1及OCR同页attempt_no>1的已发送尝试，不使用模型任务全局序号"
          "type": "integer"
          "minimum": 0
          "format": "int64"
        "unknownRetryAttempts":
          "type": "integer"
          "minimum": 0
          "format": "int64"
          "description": "范围内dispatched模型尝试中，历史逻辑步骤归属未知的数量"
        "taskStatuses":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CountBucket"
        "taskCompletionRate":
          "type": "number"
          "minimum": 0
          "maximum": 1
          "nullable": true
        "candidateTaskCount":
          "description": "范围内创建任务中曾有validation_json.valid=true候选的任务数，含MOCK及后来INVALIDATED，不等于模型质量"
          "type": "integer"
          "minimum": 0
        "knownCosts":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CostSummary"
        "unknownCostAttempts":
          "description": "已发送外部尝试中金额缺失/负数或币种缺失/不为3位大写字母的数量，不能补0费用"
          "type": "integer"
          "minimum": 0
        "metricNotes":
          "type": "array"
          "items":
            "type": "string"
      "additionalProperties": false
      "required":
        - "from"
        - "to"
        - "timezone"
        - "activeMaterialCount"
        - "restrictedMaterialCount"
        - "subjects"
        - "uploadTrend"
        - "modelAttemptCount"
        - "ocrAttemptCount"
        - "retryAttemptCount"
        - "unknownRetryAttempts"
        - "taskStatuses"
        - "taskCompletionRate"
        - "candidateTaskCount"
        - "knownCosts"
        - "unknownCostAttempts"
        - "metricNotes"
