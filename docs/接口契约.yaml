          "maxLength": 255
        "content":
          "type": "string"
          "minLength": 1
          "maxLength": 8000
        "summary":
          "type": "string"
          "maxLength": 2000
          "nullable": true
        "tags":
          "type": "array"
          "items":
            "type": "string"
            "minLength": 1
            "maxLength": 64
          "maxItems": 10
          "uniqueItems": true
        "subject":
          "type": "string"
          "maxLength": 64
          "nullable": true
      "additionalProperties": false
      "required":
        - "version"
    "ParentInput":
      "type": "object"
      "description": "parentCardId必须存在，null明确设为根；不接收用户身份或正文。层级改变使用卡片版本，禁止自父与间接环。"
      "properties":
        "version":
          "type": "integer"
          "minimum": 1
        "parentCardId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
          "nullable": true
      "additionalProperties": false
      "required":
        - "version"
        - "parentCardId"
    "CardSource":
      "type": "object"
      "description": "固定版本来源；extractionMethod保留提取方式，qualityNote保留OCR质量提示。来源删除或受限时quoteText、content、qualityNote返回null。"
      "properties":
        "extractionMethod":
          "type": "string"
          "enum": ["TEXT", "METADATA", "PDF_TEXT", "OCR"]
        "qualityNote":
          "type": "string"
          "nullable": true
        "chunkId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "materialId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "materialTitle":
          "type": "string"
        "materialVersion":
          "type": "integer"
          "minimum": 1
        "pageNo":
          "type": "integer"
          "minimum": 1
          "nullable": true
        "quoteText":
          "type": "string"
          "nullable": true
        "content":
          "type": "string"
          "nullable": true
        "isAvailable":
          "type": "boolean"
        "unavailableReason":
          "type": "string"
          "nullable": true
      "additionalProperties": false
      "required":
        - "chunkId"
        - "materialId"
        - "materialTitle"
        - "materialVersion"
        - "isAvailable"
    "CardSourceList":
      "type": "object"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CardSource"
      "additionalProperties": false
      "required":
        - "items"
    "RelationInput":
      "type": "object"
      "description": "两端ID为字符串、版本为整数；手工说明去首尾空白且非空。RELATED无向；PREREQUISITE起点是终点的前置知识，EXAMPLE终点是起点的示例。来源已失效的本人卡片仍可手工关联，查看来源沿用隐藏原文规则。"
      "properties":
        "sourceCardId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "sourceCardVersion":
          "type": "integer"
          "minimum": 1
        "targetCardId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "targetCardVersion":
          "type": "integer"
          "minimum": 1
        "type":
          "type": "string"
          "enum":
            - "RELATED"
            - "PREREQUISITE"
            - "EXAMPLE"
        "evidenceText":
          "type": "string"
          "minLength": 1
          "maxLength": 2000
      "additionalProperties": false
      "required":
        - "sourceCardId"
        - "sourceCardVersion"
        - "targetCardId"
        - "targetCardVersion"
        - "type"
        - "evidenceText"
    "Relation":
      "type": "object"
      "description": "人工确认的关系说明，不自动证明事实。RELATED无向并按ID归一，其他类型保持有向；卡片后续编辑不会改写历史说明。"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "sourceCardId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "targetCardId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "type":
          "type": "string"
          "enum":
            - "RELATED"
            - "PREREQUISITE"
            - "EXAMPLE"
        "evidenceText":
          "type": "string"
      "additionalProperties": false
      "required":
        - "id"
        - "sourceCardId"
        - "targetCardId"
        - "type"
        - "evidenceText"
    "Graph":
      "type": "object"
      "description": "当前范围的已确认关系图；hasMore=true必须提示只是部分结果，边只能引用返回nodes。节点和关系均限本人未删除端点。"
      "properties":
        "nodes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Card"
          "maxItems": 200
        "edges":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Relation"
          "maxItems": 600
        "hasMore":
          "type": "boolean"
      "additionalProperties": false
      "required":
        - "nodes"
        - "edges"
        - "hasMore"
    "LayoutItem":
      "type": "object"
      "description": "逻辑坐标必须有限，范围[-100000,100000]；cardId和orderNo在同一布局内各自唯一。"
      "properties":
        "cardId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "x":
          "type": "number"
          "minimum": -100000
          "maximum": 100000
        "y":
          "type": "number"
          "minimum": -100000
          "maximum": 100000
        "orderNo":
          "type": "integer"
          "minimum": 0
          "maximum": 2147483647
      "additionalProperties": false
      "required":
        - "cardId"
        - "x"
        - "y"
        - "orderNo"
    "LayoutInput":
      "type": "object"
      "description": "最多200个本人未删除卡片，items为空代表清空。整体替换、按layoutVersion保护，不接收用户身份。"
      "properties":
        "layoutVersion":
          "type": "integer"
          "minimum": 0
          "description": "0表示尚不存在，创建时使用"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/LayoutItem"
          "maxItems": 200
      "additionalProperties": false
      "required":
        - "layoutVersion"
        - "items"
    "Layout":
      "type": "object"
      "properties":
        "layoutKey":
          "type": "string"
        "layoutVersion":
          "type": "integer"
          "minimum": 0
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/LayoutItem"
      "additionalProperties": false
      "required":
        - "layoutKey"
        - "layoutVersion"
        - "items"
    "Notification":
      "type": "object"
      "description": "任务状态与站内通知原子提交；正文为服务端固定提示，不包含原文或异常堆栈。微信账号绑定、授权和模板未开通，本轮仅NOT_REQUESTED，不发送真实微信消息。"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "type":
          "type": "string"
          "enum": ["RESULT_READY", "TASK_FAILED", "REVIEW_DECIDED"]
        "content":
          "type": "string"
        "target":
          "oneOf":
            - "type": "object"
              "additionalProperties": false
              "properties":
                "type": {"type": "string", "enum": ["AI_TASK"]}
                "taskId": {"type": "string", "pattern": "^[1-9][0-9]*$"}
              "required": ["type", "taskId"]
            - "type": "object"
              "additionalProperties": false
              "properties":
                "type": {"type": "string", "enum": ["MATERIAL"]}
                "materialId": {"type": "string", "pattern": "^[1-9][0-9]*$"}
                "reviewId": {"type": "string", "pattern": "^[1-9][0-9]*$"}
              "required": ["type", "materialId", "reviewId"]
        "isRead":
          "type": "boolean"
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "channelStatus":
          "type": "string"
          "enum": ["NOT_REQUESTED"]
      "additionalProperties": false
      "required": ["id", "type", "content", "target", "isRead", "createdAt", "channelStatus"]
    "ReadState":
      "type": "object"
      "properties":
        "isRead":
          "type": "boolean"
      "additionalProperties": false
      "required":
        - "isRead"
    "Favorite":
      "type": "object"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "MATERIAL"
            - "CARD"
        "targetId":
          "type": "string"
          "pattern": "^[1-9][0-9]*$"
          "description": "十进制BIGINT字符串"
        "title":
          "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
      "additionalProperties": false
      "required":
        - "type"
        - "targetId"
        - "title"
        - "createdAt"
    "ReviewRequest":
      "type": "object"
