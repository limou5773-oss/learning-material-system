    "AdminTaskStep":
      "type": "object"
      "properties":
        "stepNo":
          "type": "integer"
          "minimum": 1
        "attemptNo":
          "type": "integer"
          "minimum": 1
        "toolName":
          "type": "string"
          "enum":
          - "prepare_source"
          - "extract_pdf_text"
          - "recognize_image"
          - "search_personal_materials"
          - "generate_summary_cards"
          - "validate_candidate"
          - "planner"
          - "UNKNOWN"
        "providerKind":
          "type": "string"
          "enum":
          - "LOCAL"
          - "MODEL"
          - "OCR"
          - "UNKNOWN"
        "status":
          "type": "string"
          "enum":
          - "RUNNING"
          - "SUCCESS"
          - "FAILED"
          - "UNKNOWN"
        "errorCode":
          "type": "string"
          "nullable": true
          "description": "已知内部错误标识或UNRECOGNIZED_ERROR；无错误为null"
        "startedAt":
          "type": "string"
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "finishedAt":
          "type": "string"
          "nullable": true
          "format": "date-time"
          "description": "UTC ISO 8601，带Z"
        "durationMs":
          "type": "integer"
          "minimum": 0
          "format": "int64"
          "nullable": true
          "description": "本条工具记录的非负结束跨度；未结束或无效为null，不代表厂商实际耗时/请求次数"
      "additionalProperties": false
      "required":
      - "stepNo"
      - "attemptNo"
      - "toolName"
      - "providerKind"
      - "status"
      - "errorCode"
      - "startedAt"
      - "finishedAt"
      - "durationMs"
