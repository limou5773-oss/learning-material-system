spring:
  application:
    name: learning-material-system
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 34MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  port: 8080

lms:
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
  model:
    provider: ${MODEL_PROVIDER:disabled}
    name: ${MODEL_NAME:deepseek-flash}
    api-key: ${MODEL_API_KEY:}
  ocr:
    enabled: ${OCR_ENABLED:false}
    provider: ${OCR_PROVIDER:disabled}
    secret-id: ${OCR_SECRET_ID:}
    secret-key: ${OCR_SECRET_KEY:}
  task:
    processor:
      mode: ${TASK_PROCESSOR_MODE:disabled}
    worker:
      enabled: ${TASK_WORKER_ENABLED:false}
      poll-ms: 1000
      heartbeat-ms: 10000
