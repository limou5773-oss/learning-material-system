# 日常配置直接在本文件修改；修改后重启后端。
spring:
  application:
    name: learning-material-system
  datasource:
    # MySQL 地址、数据库名、账号和密码
    url: jdbc:mysql://127.0.0.1:3306/learning_material_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: root
    password: ""
  flyway:
    enabled: false # 合并 SQL 采用手动导入方式；首次使用前需先建好数据表
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 34MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  port: 8080

lms:
  admin-bootstrap:
    # 仅首次创建管理员时开启，成功后关闭
    enabled: false
    username: ""
    password: ""
    display-name: ""
  model:
    # 接入 DeepSeek：provider 改为 deepseek，并填写 api-key
    provider: "disabled"
    name: deepseek-flash
    api-key: ""
  ocr:
    # 接入腾讯云：enabled 改为 true，provider 改为 tencent，并填写两项密钥
    enabled: false
    provider: "disabled"
    secret-id: ""
    secret-key: ""
  task:
    processor:
      # agent=智能体，model=固定生成，mock=模拟，disabled=关闭
      mode: agent
    worker:
      # 需要处理整理任务时开启；真实 AI/OCR 请求可能产生费用
      enabled: false
      poll-ms: 1000
      heartbeat-ms: 10000
  wechat:
    # 真实微信登录需填写与小程序项目一致的 AppID 和 AppSecret，再开启
    enabled: false
    app-id: "wx9980e36f77a1784f"
    app-secret: ""


# 上传目录留空沿用当前用户目录下 .learning-material-system/files
STORAGE_ROOT: ""
FILE_MAX_IMAGE_BYTES: 10485760
FILE_MAX_PDF_BYTES: 31457280
